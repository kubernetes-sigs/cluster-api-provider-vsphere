version: "2"
run:
  timeout: 10m
  go: "1.26"
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - asasalint # warns about passing []any to func(...any) without expanding it
    - asciicheck # non ascii symbols
    - bidichk # dangerous unicode sequences
    - bodyclose # unclosed http bodies
    - canonicalheader # canonical HTTP header names
    - containedctx # context.Context nested in a struct
    - copyloopvar # copying loop variables
    - depguard # blocks dependencies
    - dogsled # too many blank identifiers in assignments
    - dupword # duplicate words
    - durationcheck # multiplying two durations
    - errcheck # unchecked errors
    - errchkjson # invalid types passed to json encoder
    - fatcontext # nested contexts in loops and function literals
    - exptostd # golang.org/x/exp functions that can be replaced by std functions
    - forbidigo # allows to block usage of funcs
    - ginkgolinter # ginkgo and gomega
    - gocheckcompilerdirectives # invalid go compiler directives
    - gocritic # bugs, performance, style (we could add custom ones to this one)
    - godot # checks that comments end in a period
    - godox # block FIXMEs
    - goprintffuncname # printft-like functions should be named with f at the end
    - gosec # potential security problems
    - govet # basically 'go vet'
    - importas # consistent import aliases
    - ineffassign # ineffectual assignments
    - intrange # suggest using integer range in for loops
    - iotamixing # iota mixed with other values in const blocks
    - loggercheck # check for even key/value pairs in logger calls
    - makezero # append to slices initialized with non-zero length
    - mirror # suggests alternative bytes/strings functions to avoid allocations
    - misspell # spelling
    - nakedret # naked returns (named return parameters and an empty return)
    - nilerr # returning nil after checking err is not nil
    - nilnesserr # returning a different nil error after checking err is not nil
    - noctx # http requests without context.Context
    - nolintlint # badly formatted nolint directives
    - nosprintfhostport # using sprintf to construct host:port in a URL
    - prealloc # suggest preallocating slices
    - predeclared # shadowing predeclared identifiers
    - reassign # reassigning package level variables of other packages
    - revive # better version of golint
    - staticcheck # some of staticcheck's rules
    - thelper # test helpers not starting with t.Helper()
    - tparallel # inappropriate usage of t.Parallel()
    - unconvert # unnecessary type conversions
    - unparam # unused function parameters
    - unused # unused constants, variables,functions, types
    - usestdlibvars # using variables/constants from the standard library
    - usetesting # report function to be replace by testing
    - wastedassign # assignments that are never used
    - whitespace # unnecessary newlines
  settings:
    depguard:
      rules:
        api:
          list-mode: strict
          files:
            - "**/cluster-api-provider-vsphere/api/**/*.go"
          allow:
            - $gostd
            - k8s.io/api/core/v1$
            - k8s.io/api/rbac/v1$ # drop after ProviderServiceAccountSpec has been removed
            - k8s.io/apimachinery/pkg/api/resource$
            - k8s.io/apimachinery/pkg/apis/meta/v1$
            - k8s.io/apimachinery/pkg/conversion$
            - k8s.io/apimachinery/pkg/runtime$
            - k8s.io/apimachinery/pkg/runtime/schema$
            - sigs.k8s.io/cluster-api-provider-vsphere/api
            - sigs.k8s.io/cluster-api/api
        ginkgo:
          files:
            - $all
            - "!$test"
            - "!**/cluster-api-provider-vsphere/internal/test/helpers/**"
            - "!**/cluster-api-provider-vsphere/test/e2e/**"
            - "!**/cluster-api-provider-vsphere/test/framework/**"
          deny:
            - pkg: github.com/onsi/ginkgo
              desc: Ginkgo should only be used in tests and test utils
        testify:
          files:
            - $all
            # Note: These files are using testify/mock for fakes.
            - "!**/cluster-api-provider-vsphere/controllers/clustermodule_reconciler_test.go"
            - "!**/cluster-api-provider-vsphere/controllers/vspherevm_controller_test.go"
            - "!**/cluster-api-provider-vsphere/pkg/clustermodule/fake/service.go"
            - "!**/cluster-api-provider-vsphere/pkg/services/fake/vmservice.go"
          deny:
            - pkg: github.com/stretchr/testify
              desc: Use gomega instead
        vm-operator:
          deny:
            - pkg: "github.com/vmware-tanzu/vm-operator/api"
              desc: Use vmoprvhub in prod code instead
    forbidigo:
      forbid:
        - pattern: ctrl.NewControllerManagedBy
          msg: Use capicontrollerutil.NewControllerManagedBy instead
        - pattern: ^context\.TODO$
          msg: Pass a context.Context instead
    ginkgolinter:
      forbid-focus-container: true
      force-expect-to: true
      force-succeed: true
      force-tonot: true
    gocritic:
      disabled-checks:
        - appendAssign
        - dupImport # https://github.com/go-critic/go-critic/issues/845
        - evalOrder
        - ifElseChain
        - octalLiteral
        - regexpSimplify
        - sloppyReassign
        - truncateCmp
        - typeDefFirst
        - unnamedResult
        - unnecessaryDefer
        - whyNoLint
        - wrapperFunc
        - rangeValCopy
        - hugeParam
        - importShadow
        - paramTypeCombine
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    godot:
      #   declarations - for top level declaration comments (default);
      #   toplevel     - for top level comments;
      #   all          - for all comments.
      scope: toplevel
      exclude:
        - ^ \+.*
        - ^ ANCHOR.*
    godox:
      keywords:
        - FIXME # FIXME's should be removed before merging PRs
    gosec:
      excludes:
      # integer overflow conversion int -> int32
        - G115
    importas:
      no-unaliased: true
      alias:
        # Kubernetes
        - pkg: k8s.io/api/core/v1
          alias: corev1
        - pkg: k8s.io/apiextensions-apiserver/pkg/apis/apiextensions/v1
          alias: apiextensionsv1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
        - pkg: k8s.io/apimachinery/pkg/api/errors
          alias: apierrors
        - pkg: k8s.io/apimachinery/pkg/util/errors
          alias: kerrors
        - pkg: k8s.io/component-base/logs/api/v1
          alias: logsv1
        # Controller Runtime
        - pkg: sigs.k8s.io/controller-runtime
          alias: ctrl
        # Misc
        - pkg: github.com/pkg/errors
          alias: pkgerrors
        - pkg: errors
          alias: ""
        # CAPV
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/api/govmomi/v1beta1
          alias: infrav1beta1
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/api/govmomi/v1beta2
          alias: infrav1
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/api/supervisor/v1beta1
          alias: vmwarev1beta1
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/api/supervisor/v1beta2
          alias: vmwarev1
        # Conversions
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/pkg/conversion/client
          alias: conversionclient
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/pkg/conversion/api
          alias: conversionapi
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/pkg/conversion/api/meta
          alias: conversionmeta
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/pkg/conversion/api/vmoperator/hub
          alias: vmoprvhub
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/pkg/conversion/api/vmoperator/v1alpha2
          alias: vmoprv1alpha2conversion
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/pkg/conversion/api/vmoperator/v1alpha5
          alias: vmoprv1alpha5conversion
        - pkg: sigs.k8s.io/cluster-api-provider-vsphere/pkg/conversion/api/vmoperator/v1alpha6
          alias: vmoprv1alpha6conversion
        # VM Operator
        - pkg: github.com/vmware-tanzu/vm-operator/api/v1alpha2
          alias: vmoprv1alpha2
        - pkg: github.com/vmware-tanzu/vm-operator/api/v1alpha2/common
          alias: vmoprv1alpha2common
        - pkg: github.com/vmware-tanzu/vm-operator/api/v1alpha5
          alias: vmoprv1alpha5
        - pkg: github.com/vmware-tanzu/vm-operator/api/v1alpha5/common
          alias: vmoprv1alpha5common
        - pkg: github.com/vmware-tanzu/vm-operator/api/v1alpha6
          alias: vmoprv1alpha6
        - pkg: github.com/vmware-tanzu/vm-operator/api/v1alpha6/common
          alias: vmoprv1alpha6common
        # NSX Operator
        - pkg: github.com/vmware-tanzu/nsx-operator/pkg/apis/vpc/v1alpha1
          alias: nsxvpcv1
        # CABPK
        - pkg: sigs.k8s.io/cluster-api/api/bootstrap/kubeadm/v1beta2
          alias: bootstrapv1
        - pkg: sigs.k8s.io/cluster-api/api/bootstrap/kubeadm/v1beta1
          alias: bootstrapv1beta1
        # KCP
        - pkg: sigs.k8s.io/cluster-api/api/controlplane/kubeadm/v1beta2
          alias: controlplanev1
        # CAPI
        - pkg: sigs.k8s.io/cluster-api/api/core/v1beta2
          alias: clusterv1
        - pkg: sigs.k8s.io/cluster-api/api/core/v1beta1
          alias: clusterv1beta1
        - pkg: sigs.k8s.io/cluster-api/util/deprecated/v1beta1/conditions
          alias: v1beta1conditions
        - pkg: sigs.k8s.io/cluster-api/util/deprecated/v1beta1/conditions/v1beta2
          alias: v1beta2conditions
        - pkg: sigs.k8s.io/cluster-api/util/conditions
          alias: ""
        - pkg: sigs.k8s.io/cluster-api/util/patch
          alias: ""
        - pkg: sigs.k8s.io/cluster-api/util/conditions/deprecated/v1beta1
          alias: deprecatedv1beta1conditions
        - pkg: sigs.k8s.io/cluster-api/util/controller
          alias: "capicontrollerutil"
        - pkg: sigs.k8s.io/cluster-api/util/log
          alias: logutil
        # CAPI addons
        - pkg: sigs.k8s.io/cluster-api/api/addons/v1beta2
          alias: addonsv1
        # CAPI IPAM
        - pkg: sigs.k8s.io/cluster-api/api/ipam/v1beta2
          alias: ipamv1
        - pkg: sigs.k8s.io/cluster-api/api/ipam/v1beta1
          alias: ipamv1beta1
    loggercheck:
      no-printf-like: true
    nolintlint:
      require-specific: true
      allow-unused: false
    revive:
      rules:
        # The following rules are recommended https://github.com/mgechev/revive#recommended-configuration
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        #
        # Rules in addition to the recommended configuration above.
        #
        - name: bool-literal-in-expr
        - name: constant-logical-expr
        - name: atomic
        - name: bare-return
        - name: comment-spacings
          arguments:
            - nolint
            - +kubebuilder
            - +optional
            - +required
            - +listType
            - +listMapKey
            - +enum
            - go:build
        - name: datarace
        - name: defer
        - name: duplicated-imports
        - name: forbidden-call-in-wg-go
        - name: identical-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-conditions
        - name: inefficient-map-lookup
        - name: redundant-build-tag
        - name: redundant-import-alias
        - name: string-of-int
        - name: time-date
        - name: time-equal
        - name: unconditional-recursion
        - name: unexported-naming
        - name: unnecessary-if
        - name: use-errors-new
        - name: useless-break
        - name: useless-fallthrough
        - name: waitgroup-by-value
  exclusions:
    generated: strict
    paths:
      - zz_generated.*\.go$
      - _conversion\.go$
      - vendored_cluster_api\.go$
    # Specific exclude rules for deprecated fields that are still part of the codebase. These
    # should be removed as the referenced deprecated item is removed from the project.
    rules:
      # TODO: Excludes that can be removed as part of the CAPV v1.20 release.
      - linters:
          - staticcheck
        text: 'SA1019: feature.(PriorityQueue|ReconcilerRateLimiting) is deprecated'

      # Specific exclude rules for deprecated types that are still part of the codebase. These
      # should be removed as the referenced deprecated types are removed from the project.
      # ProviderServiceAccount
      - linters:
          - staticcheck
        text: 'SA1019: .* ProviderServiceAccount is deprecated and is going to be removed in one of the upcoming CAPV releases'
      # v1Beta1 deprecated fields
      - linters:
          - staticcheck
        text: 'SA1019: .*\.Deprecated\.V1Beta1.* is deprecated'
      - linters:
          - staticcheck
        text: 'SA1019: clusterv1\.(Condition|Conditions|ConditionSeverity|ConditionType) is deprecated'
      - linters:
          - staticcheck
        text: 'SA1019: .* is deprecated: This package is deprecated and is going to be removed when support for v1beta1 will be dropped.'
        # Excludes for controller-runtime deprecations that we should migrate away from sooner or later
      - linters:
          - staticcheck
        text: 'SA1019: mgr.GetEventRecorderFor is deprecated'
        # Deprecations for old api groups
      - linters:
          - staticcheck
        text: 'SA1019: "sigs.k8s.io/cluster-api/api/core/v1beta1" is deprecated: This package is deprecated and is going to be removed when support for v1beta1 will be dropped.'
        # Deprecations for old fields for conversion tests
      - linters:
          - staticcheck
        path: '.*/conversion_test.go'
        text: 'SA1019: .*'
        # Exclude for hub types
      - linters:
          - revive
        path: pkg/conversion/api/vmoperator/hub/(.+)_types.go
        text: 'exported (type|const) (.+) should have comment or be unexported'
      - linters:
          - revive
        path: pkg/conversion/api/vmoperator/hub/(.+)_types.go
        text: 'exported (type|const) (.+) should have comment \(or a comment on this block\) or be unexported'
        # Allow direct usage of vm-operator APIs in a few places like e.g. tests and main.go
      - linters:
          - depguard
        path: main.go|feature/feature.go|feature/gates.go|pkg/manager/manager.go|.*_test.go|internal/test/helpers/.*|pkg/context/fake/fake_controller_manager_context.go|pkg/conversion/.*|pkg/util/testutil.go
        text: 'Use vmoprvhub in prod code instead'
      - linters:
          - staticcheck
        text: 'SA1019: "sigs.k8s.io/cluster-api/util/deprecated/v1beta1/.*" is deprecated'
      - linters:
          - staticcheck
        text: 'SA1019: corev1.Endpoints is deprecated: This API is deprecated in v1.33\+. Use discoveryv1.EndpointSlice.'
      - linters:
          - staticcheck
        text: 'SA1019: corev1.EndpointSubset is deprecated: This API is deprecated in v1.33\+.'
      - linters:
          - revive
        text: 'exported: exported method .*\.(Reconcile|SetupWithManager|SetupWebhookWithManager) should have comment or be unexported'
      - linters:
          - errcheck
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked
        # Exclude some packages or code to require comments, for example test code, or fake clients.
      - linters:
          - revive
        text: exported (method|function|type|const) (.+) should have comment or be unexported
        source: (func|type).*Fake.*
      - linters:
          - revive
        path: ^(test/|packaging/|pkg/.*/fake/|pkg/util/testutil).*.go
        text: exported (.+) (.+) should have comment (.*)or be unexported
      - linters:
          - revive
        path: ^packaging/.*.go
        text: a blank import should be only in a main or test package, or have a comment justifying it
        # context.TODO is fine in tests and in test framework / test infrastructure funcs that are part of their public API
        # and don't take a context.Context.
      - linters:
          - forbidigo
        path: _test\.go|test/(framework|infrastructure)/.*\.go
        text: use of `context.TODO` forbidden
        # The boskos client is based on the upstream boskos client which doesn't take a context.Context.
      - linters:
          - forbidigo
        path: hack/tools/pkg/boskos/client\.go
        text: use of `context.TODO` forbidden
        # Disable unparam "always receives" which might not be really
        # useful when building libraries.
      - linters:
          - unparam
        text: always receives
        # Dot imports for gomega and ginkgo are allowed
        # within test files and test utils.
      - linters:
          - revive
          - staticcheck
        path: _test\.go
        text: should not use dot imports
      - linters:
          - revive
          - staticcheck
        path: test/e2e/.*.go
        text: should not use dot imports
      - linters:
          - revive
          - staticcheck
        path: test/framework/.*.go
        text: should not use dot imports
      - linters:
          - revive
          - staticcheck
        path: test/helpers/vmware/.*.go
        text: should not use dot imports
      - linters:
          - revive
          - staticcheck
        path: pkg/conversion/test/.*.go
        text: should not use dot imports
        # Append should be able to assign to a different var/slice.
      - linters:
          - gocritic
        text: 'appendAssign: append result not assigned to the same slice'
        # Disable linters for conversion
      - linters:
          - staticcheck
        path: ^api\/.*\/.*conversion.*\.go$
        text: 'SA1019: in.(.+) is deprecated'
      - linters:
          - revive
        # Ignoring stylistic checks for generated code
        path: ^api\/.*\/.*conversion.*\.go$
        # Checking if an error is nil to just after return the error or nil is redundant
        text: 'if-return: redundant if ...; err != nil check, just return error instead'
      - linters:
          - revive
        # Ignoring stylistic checks for generated code
        path: ^api\/.*\/.*conversion.*\.go$
        # Exported function and methods should have comments. This warns on undocumented exported functions and methods.
        text: exported (method|function|type|const) (.+) should have comment or be unexported
      - linters:
          - revive
        # Ignoring stylistic checks for generated code
        path: ^api\/.*\/.*conversion.*\.go$
        # This rule warns when initialism, variable or package naming conventions are not followed.
        text: 'var-naming: don''t use underscores in Go names;'
      - linters:
          - revive
        # Ignoring stylistic checks for generated code
        path: ^api\/.*\/.*conversion.*\.go$
        # By convention, receiver names in a method should reflect their identity.
        text: 'receiver-naming: receiver name'
      - linters:
          - staticcheck
        path: ^api\/.*\/.*conversion.*\.go$
        text: 'ST1003: should not use underscores in Go names;'
      - linters:
          - staticcheck
        path: ^api\/.*\/.*conversion.*\.go$
        text: 'ST1016: methods on the same type should have the same receiver name'
      - linters:
          - goconst
        path: (.+)_test\.go
        # It's clearer to see that a field gets accessed or func gets called on the embedded objects
      - linters:
          - staticcheck
        path: (.+)\.go$
        text: 'QF1008: could remove embedded field'
      - linters:
          - revive
        path: pkg/util/.*\.go$
        text: 'var-naming: avoid meaningless package names'
      - linters:
          - revive
        path: (pkg/context|pkg/services/govmomi/net)/.*\.go$
        text: 'var-naming: avoid package names that conflict with Go standard library package names'
      # packaging go module
      - linters:
          - revive
        path: packaging/flavorgen/flavors/(crs/types|util)/.*\.go$
        text: 'var-naming: avoid meaningless package names'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci # ensures imports are organized
    - gofmt # warns about incorrect use of fmt functions
    - goimports # import formatting
  settings:
    gci:
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(sigs.k8s.io/cluster-api-provider-vsphere) # Custom section: groups all imports with the specified Prefix.
      custom-order: true
  exclusions:
    generated: strict
    paths:
      - zz_generated.*\.go$
      - _conversion\.go$
      - vendored_cluster_api\.go$
